name: Scheduled Release

# Runs on a fixed 2-week cadence: one Tuesday triggers the production deploy, the Tuesday in
# between opens a reminder to promote the release lane into beta for the testing week. Two cron
# entries (05:00 and 06:00 UTC) cover both CDT and CST, and the local-time check below picks the
# one that actually lands at 00:00 America/Chicago - this avoids having to hand-edit the cron
# expression twice a year for DST.
on:
  schedule:
    - cron: "0 5 * * 2"
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: team_lt1WiqzhL2Jk7Lhi6INhUaa6
  VERCEL_PROJECT_ID: prj_YzyipEHmK2ue1O2KXDeNH8NjNV5U
  RENDER_SERVICE_ID: srv-d98gs99o3t8c739pfapg
  # Reference date for a scheduled production release. Any Tuesday exactly N*14 days from this
  # one is a release; the Tuesday 7 days off from it (either direction) is a beta-promotion
  # reminder instead.
  RELEASE_ANCHOR: "2026-10-06"

jobs:
  determine-cycle:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.check.outputs.action }}
    steps:
      - name: Determine today's action (release, reminder, or nothing)
        id: check
        run: |
          LOCAL_HOUR=$(TZ=America/Chicago date +%H)
          LOCAL_DOW=$(TZ=America/Chicago date +%u)
          if [ "$LOCAL_DOW" != "2" ] || [ "$LOCAL_HOUR" != "00" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          DAYS_SINCE=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$RELEASE_ANCHOR" +%s) ) / 86400 ))
          MOD=$(( ((DAYS_SINCE % 14) + 14) % 14 ))

          if [ "$MOD" -eq 0 ]; then
            echo "action=release" >> "$GITHUB_OUTPUT"
          elif [ "$MOD" -eq 7 ]; then
            echo "action=reminder" >> "$GITHUB_OUTPUT"
          else
            echo "action=none" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: determine-cycle
    if: needs.determine-cycle.outputs.action == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  reminder:
    needs: determine-cycle
    if: needs.determine-cycle.outputs.action == 'reminder'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open beta-promotion reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Promote to beta — testing week starts today" \
            --label "infra" \
            --body "Two-week release cycle: today starts the beta testing week. Promote the current release lane's work into \`beta\` when ready. Production release is scheduled for next Tuesday."
