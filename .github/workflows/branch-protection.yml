name: Branch protection

on:
  pull_request:
    branches: [develop, beta, master, 'v*', '[0-9]*']

jobs:
  check-source-branch:
    name: Enforce source branch
    runs-on: ubuntu-latest

    steps:
      - name: Check allowed source branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          echo "PR: $SOURCE → $TARGET"

          if [[ "$TARGET" == "develop" && "$SOURCE" != "beta" && ! "$SOURCE" =~ ^(feature|bugfix)/ && ! "$SOURCE" =~ ^(v[0-9]|[0-9]) ]]; then
            echo "Error: PRs targeting 'develop' must come from 'beta' (sync-back), a release lane, or a 'feature/*'/'bugfix/*' branch (got '$SOURCE')"
            exit 1
          fi

          if [[ "$TARGET" =~ ^(v[0-9]|[0-9]) && "$SOURCE" != "develop" && ! "$SOURCE" =~ ^(feature|bugfix)/ ]]; then
            echo "Error: PRs targeting '$TARGET' must come from 'develop' (sync-forward) or a 'feature/*'/'bugfix/*' branch (got '$SOURCE')"
            exit 1
          fi

          if [[ "$TARGET" == "beta" && "$SOURCE" != "develop" && "$SOURCE" != "master" && ! "$SOURCE" =~ ^bugfix/ ]]; then
            echo "Error: PRs targeting 'beta' must come from 'develop' or 'master' (sync-back), or a 'bugfix/*' hotfix branch (got '$SOURCE')"
            exit 1
          fi

          if [[ "$TARGET" == "master" && "$SOURCE" != "beta" ]]; then
            echo "Error: PRs targeting 'master' must come from 'beta' (got '$SOURCE')"
            exit 1
          fi

          echo "Source branch '$SOURCE' is allowed to merge into '$TARGET'"