name: Branch protection

on:
  pull_request:
    branches: [develop, beta, master, 'v*']

jobs:
  check-source-branch:
    name: Enforce source branch
    runs-on: ubuntu-latest

    steps:
      - name: Check allowed source branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          echo "PR: $SOURCE → $TARGET"

          if [[ ( "$TARGET" == "develop" || "$TARGET" =~ ^v[0-9] ) && ! "$SOURCE" =~ ^(feature|bugfix)/ ]]; then
            echo "Error: PRs targeting '$TARGET' must come from a 'feature/*' or 'bugfix/*' branch (got '$SOURCE')"
            exit 1
          fi

          if [[ "$TARGET" == "beta" && "$SOURCE" != "develop" ]]; then
            echo "Error: PRs targeting 'beta' must come from 'develop' (got '$SOURCE')"
            exit 1
          fi

          if [[ "$TARGET" == "master" && "$SOURCE" != "beta" ]]; then
            echo "Error: PRs targeting 'master' must come from 'beta' (got '$SOURCE')"
            exit 1
          fi

          echo "Source branch '$SOURCE' is allowed to merge into '$TARGET'"