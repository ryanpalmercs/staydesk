version: '3.8'
services:
  postgres-local:
    image: postgres:15-alpine
    container_name: eternatel_billing_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: eternatel_billing_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: