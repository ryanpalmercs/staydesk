<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page {
            size: letter;
            margin: 1in;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 10pt;
            color: #222;
        }

        h1 {
            font-size: 14pt;
            margin: 0 0 4px;
        }

        .period {
            font-size: 10pt;
            color: #555;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 11pt;
            margin: 0 0 8px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 24px;
        }

        th {
            text-align: left;
            border-bottom: 2px solid #333;
            padding: 4px 6px;
            font-size: 9pt;
        }

        td {
            padding: 4px 6px;
            border-bottom: 1px solid #ddd;
        }

        .text-right {
            text-align: right;
        }
    </style>
</head>
<body>
<h1>Report</h1>
<div class="period"
     th:text="${#temporals.format(report.startDate, 'MMM d, yyyy')} + ' – ' + ${#temporals.format(report.endDate, 'MMM d, yyyy')}">
</div>

<h2>Summary</h2>
<table>
    <tbody>
    <tr>
        <td>Total Revenue</td>
        <td class="text-right"
            th:text="'$' + ${#numbers.formatDecimal(report.totalRevenue, 1, 'COMMA', 2, 'POINT')}"></td>
    </tr>
    <tr>
        <td>Total Tax</td>
        <td class="text-right" th:text="'$' + ${#numbers.formatDecimal(report.totalTax, 1, 'COMMA', 2, 'POINT')}"></td>
    </tr>
    <tr>
        <td>Occupancy Rate</td>
        <td class="text-right" th:text="${#numbers.formatDecimal(report.occupancyRate * 100, 1, 2)} + '%'"></td>
    </tr>
    <tr>
        <td>Occupied Nights</td>
        <td class="text-right" th:text="${report.occupiedNightCount}"></td>
    </tr>
    <tr>
        <td>Total Room Nights</td>
        <td class="text-right" th:text="${report.totalRoomNightCount}"></td>
    </tr>
    <tr>
        <td>Avg Nightly Rate</td>
        <td class="text-right"
            th:text="'$' + ${#numbers.formatDecimal(report.averageNightlyRate, 1, 'COMMA', 2, 'POINT')}"></td>
    </tr>
    </tbody>
</table>

<h2>Room Breakdown</h2>
<table>
    <thead>
    <tr>
        <th>Room</th>
        <th class="text-right">Booked Nights</th>
        <th class="text-right">Total Nights</th>
        <th class="text-right">Occupancy %</th>
        <th class="text-right">Revenue</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${report.roomBreakDown}">
        <td th:text="${row.roomNumber}"></td>
        <td class="text-right" th:text="${row.bookedNights}"></td>
        <td class="text-right" th:text="${row.totalNights}"></td>
        <td class="text-right" th:text="${#numbers.formatDecimal(row.occupancyRate * 100, 1, 2)} + '%'"></td>
        <td class="text-right" th:text="'$' + ${#numbers.formatDecimal(row.revenue, 1, 'COMMA', 2, 'POINT')}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
